name: Deploy preview

# Optional GitHub Pages deploy, kept on manual dispatch only.
#
# The studio deploys to Cloudflare Pages instead (see docs/DEPLOY.md): Pages on
# a PRIVATE repository requires a paid GitHub plan, and that paywall would sit
# in front of the whole studio rather than just a video preview.
#
# This workflow stays so the option is still there if Pages is ever enabled —
# but it no longer runs on push, so it can't sit permanently red. The studio
# bundle is still built on every push by the Validate workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content
      - name: Build preview
        # Pages serves from /<repo>/, so the asset + staticFile base must match.
        run: npx vite build
        env:
          PREVIEW_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
