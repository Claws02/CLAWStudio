name: Validate

# Cheap and runs on every push: catches broken YAML, dangling ids, and verdicts
# that contradict their own weights before you burn CI minutes on a render.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build + validate content
        run: npm run content
      - name: Typecheck
        run: npm run typecheck
      - name: Build preview bundle
        run: npx vite build
